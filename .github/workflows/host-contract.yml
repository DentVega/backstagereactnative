name: Publish host contract
on:
  workflow_dispatch:
  push:
    branches: [main]
    # pnpm-lock.yaml (repo root): the contract's versions come from resolved installs,
    # so a lockfile-only dep bump must also re-publish.
    paths: ['apps/host/shared-deps.mjs', 'apps/host/package.json', 'pnpm-lock.yaml']
jobs:
  publish:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/host } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: corepack enable && pnpm install --frozen-lockfile
        working-directory: .
      - run: node scripts/gen-host-contract.mjs
      - run: node scripts/publish-host-contract.mjs
        env:
          BACKSTAGE_URL: ${{ secrets.BACKSTAGE_URL }}
          HOST_CONTRACT_TOKEN: ${{ secrets.HOST_CONTRACT_TOKEN }}
